services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 2s
      timeout: 3s
      retries: 20

  flyway:
    image: flyway/flyway:10
    command: >
      -url=jdbc:postgresql://db:5432/marketplace
      -user=marketplace -password=marketplace
      -connectRetries=10
      migrate
    volumes:
      - ./db/migration:/flyway/sql:ro
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://marketplace:marketplace@db:5432/marketplace
      ORDER_RATE_LIMIT_MINUTES: "1"
    ports:
      - "8000:8000"
    depends_on:
      flyway:
        condition: service_completed_successfully

volumes:
  pgdata:
